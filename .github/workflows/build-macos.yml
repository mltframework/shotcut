name: build-shotcut-macos

on:
  workflow_dispatch:
  schedule:
    # nightly
    - cron: '0 12 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'mltframework' }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Download from S3
        run: |
          VERSION=$(date +"%y.%-m.%-d")
          echo VERSION=$VERSION
          aws s3 cp s3://builds.us.meltytech/shotcut-build-macos.txt.xz . --no-progress
          aws s3 cp s3://builds.us.meltytech/shotcut/shotcut-macos-unsigned-$VERSION.dmg . --no-progress

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-dmg
          path: |
            *.dmg

      - name: Dump log
        run: xzcat shotcut-build-macos.txt.xz
